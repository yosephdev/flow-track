version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Stockholm
    # Security fixes remain enabled; suppress routine version-update PRs.
    open-pull-requests-limit: 0
    groups:
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "fix(deps)"
